<p>Choose a strong, unique password for your private admin account. This page only works from a valid password-recovery email link.</p>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const supabase=window.supabase.createClient("https://jakcqdeyvbbgdwctomdu.supabase.co","sb_publishable_-fWvxeQlGA1ocIVgxWguaA_5MUUo67-");
const form=document.getElementById("passwordForm"),status=document.getElementById("status"),save=document.getElementById("savePassword");
const params=new URLSearchParams(location.search),hashParams=new URLSearchParams(location.hash.replace(/^#/,""));
const recoveryAttempt=params.has("code")||hashParams.get("type")==="recovery"||params.get("type")==="recovery";
let recoverySession=false;

if(error||!data.session){status.textContent="This recovery link is invalid, expired or already used. Return to admin sign-in and request a new one.";return;}
showForm();})();
form.addEventListener("submit",async event=>{event.preventDefault();if(!recoverySession)return;const password=document.getElementById("newPassword").value,confirm=document.getElementById("confirmPassword").value;if(password.length<12){status.textContent="Use at least 12 characters for a stronger password.";return;}if(password!==confirm){status.textContent="The passwords do not match. Please check them.";return;}save.disabled=true;status.textContent="Updating your password securely…";const {error}=await supabase.auth.updateUser({password});if(error){status.textContent="Password could not be updated. The link may have expired; request a new one and try again.";save.disabled=false;return;}await supabase.auth.signOut();form.hidden=true;status.textContent="Your password has been updated. You can now sign in to the admin dashboard.";});
