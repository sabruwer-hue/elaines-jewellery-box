<!doctype html>
<html lang="en-ZA"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#d8b85f"><title>Your Second Life Studio quotation · Elaine's Jewellery Box</title><link rel="icon" href="icons/icon.svg" type="image/svg+xml"><style>
:root{color-scheme:light;--gold:#c9a44c;--ink:#111;--paper:#fffaf0;--muted:#6c624e}*{box-sizing:border-box}body{margin:0;background:#e5c66f;color:var(--ink);font:15px/1.6 Arial,sans-serif}.brand{font:18px Georgia,serif;letter-spacing:.2px}.brand b{display:inline-grid;place-items:center;background:#111;color:#e5c66f;padding:8px 10px;margin-right:8px}main{max-width:850px;margin:32px auto;padding:0 16px}.card{background:var(--paper);border:1px solid var(--gold);padding:clamp(20px,5vw,42px);box-shadow:0 12px 35px #0001}.rule{height:3px;background:var(--gold);margin:20px 0}h1,h2{font-family:Georgia,serif;font-weight:normal}h1{font-size:clamp(27px,5vw,40px);line-height:1.2}h2{font-size:22px;margin-top:28px}.muted{color:var(--muted)}.meta{display:grid;grid-template-columns:1fr 1fr;gap:16px}.meta div{padding:12px;background:#f5eedc}.meta strong{display:block;font-size:11px;text-transform:uppercase;letter-spacing:1px}.meta span{font-size:14px}table{width:100%;border-collapse:collapse;margin:18px 0}th,td{text-align:left;padding:11px 7px;border-bottom:1px solid #dfd3b4;font-size:13px}th:last-child,td:last-child{text-align:right}.total{text-align:right;font-size:20px;font-weight:bold;margin:20px 0}.copy{white-space:pre-wrap}.response{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.response button{border:1px solid #111;background:#111;color:#f5dc91;padding:13px 17px;min-height:46px;border-radius:10px;font-weight:bold}.response button.secondary{background:transparent;color:#111}textarea{width:100%;min-height:90px;padding:12px;border:1px solid #c9a44c;font:14px Arial;background:white}.status{padding:12px;background:#f5eedc;margin:14px 0}.hidden{display:none!important}@media(max-width:560px){main{margin:12px auto;padding:0 10px}.meta{grid-template-columns:1fr}th,td{font-size:11px;padding:8px 4px}}
</style></head><body><main><div class="brand"><b>EBJ</b> Elaine's Jewellery Box</div><section class="card" id="content"><h1>Your quotation</h1><p class="muted">Loading your secure Second Life Studio quotation…</p></section></main><script>
(()=>{const box=document.getElementById("content"),params=new URLSearchParams(location.search),token=params.get("token");const endpoint="https://jakcqdeyvbbgdwctomdu.supabase.co/functions/v1/studio-quote-portal";const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const money=n=>"R"+(Number(n||0)/100).toFixed(2);const date=s=>s?new Date(s).toLocaleDateString("en-ZA"):"Not specified";
async function load(){if(!token||!/^[a-f0-9]{64}$/i.test(token)){box.innerHTML="<h1>Quotation link unavailable</h1><p>Please check the link in your email or contact Elaine.</p>";return;}try{const r=await fetch(endpoint+"?token="+encodeURIComponent(token));const data=await r.json();if(!r.ok)throw new Error(data.error||"This quotation could not be opened.");render(data.quote);}catch(e){box.innerHTML="<h1>We couldn't open this quotation</h1><p>"+esc(e.message)+"</p><p>Please contact Elaine's Jewellery Box for help.</p>";}}
function render(q){const e=q.studio_enquiries||{},lines=q.studio_quote_lines||[],steps=q.studio_quote_steps||[];const rows=lines.map(x=>"<tr><td>"+esc(x.description)+"</td><td>"+esc(x.quantity)+"</td><td>"+money(x.line_total_minor)+"</td></tr>").join("");const roadmap=steps.map(x=>"<li><strong>"+esc(x.title)+"</strong>"+(x.description?" — "+esc(x.description):"")+(x.estimated_days!==null&&x.estimated_days!==undefined?" <span class='muted'>(estimated "+esc(x.estimated_days)+" days)</span>":"")+"</li>").join("");const responded=["accepted","declined","changes_requested"].includes(q.status);box.innerHTML="<h1>Second Life Studio quotation</h1><p class='muted'>Prepared by Elaine's Jewellery Box · "+esc(q.quote_reference)+" · Version "+esc(q.version)+"</p><div class='rule'></div><div class='meta'><div><strong>Prepared for</strong><span>"+esc(e.customer_name)+"</span></div><div><strong>Project</strong><span>"+esc(e.item_description)+"</span></div><div><strong>Valid until</strong><span>"+date(q.valid_until)+"</span></div><div><strong>Estimated duration</strong><span>"+esc(q.estimated_duration||"To be confirmed")+"</span></div></div><h2>Scope and proposed outcome</h2><p class='copy'>"+esc(q.scope_of_work||q.customer_message||"Please contact Elaine to confirm the scope.")+"</p><h2>Itemised quotation</h2><table><thead><tr><th>Description</th><th>Qty</th><th>Total</th></tr></thead><tbody>"+rows+"</tbody></table><p class='total'>Total: "+money(q.subtotal_minor)+"</p>"+(Number(q.deposit_minor)>0?"<p><strong>Deposit required: "+money(q.deposit_minor)+"</strong></p>":"")+"<h2>Production roadmap</h2>"+(roadmap?"<ol>"+roadmap+"</ol>":"<p class='muted'>The detailed schedule will be confirmed with Elaine.</p>")+(q.assumptions?"<h2>Assumptions and dependencies</h2><p class='copy'>"+esc(q.assumptions)+"</p>":"")+(q.exclusions?"<h2>Not included</h2><p class='copy'>"+esc(q.exclusions)+"</p>":"")+(q.payment_terms?"<h2>Payment terms</h2><p class='copy'>"+esc(q.payment_terms)+"</p>":"")+(q.customer_message?"<h2>A note from Elaine</h2><p class='copy'>"+esc(q.customer_message)+"</p>":"")+"<div class='rule'></div><p class='muted'>This quotation is an offer for the described work. Production begins only after acceptance and the agreed payment arrangements. Estimated timings may change if assumptions or material availability change.</p>"+(responded?"<div class='status'>Your response has been recorded: <strong>"+esc(q.status.replace("_"," "))+"</strong>"+(q.response_note?"<p>"+esc(q.response_note)+"</p>":"")+"</div>":"<h2>Your response</h2><label for='note'>Optional note or requested changes</label><textarea id='note' maxlength='2000' placeholder='Tell Elaine anything she should know…'></textarea><div class='response'><button data-decision='accepted'>Accept quotation</button><button class='secondary' data-decision='changes_requested'>Request changes</button><button class='secondary' data-decision='declined'>Decline</button></div><p id='responseStatus' class='muted' role='status'></p>");box.querySelectorAll("[data-decision]").forEach(b=>b.addEventListener("click",()=>respond(b.dataset.decision,b)));}
async function respond(decision,button){const status=document.getElementById("responseStatus");if(decision==="accepted"&&!confirm("Accept this quotation and allow Elaine to proceed with the agreed next steps?"))return;if(decision==="declined"&&!confirm("Decline this quotation?"))return;button.disabled=true;status.textContent="Sending your response…";try{const r=await fetch(endpoint,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token,decision,note:document.getElementById("note")?.value||""})});const data=await r.json();if(!r.ok)throw new Error(data.error||"Your response could not be saved.");status.textContent=data.message;box.querySelectorAll("[data-decision]").forEach(b=>b.disabled=true); }catch(e){status.textContent=e.message;button.disabled=false;}}
load();})();
</script></body></html>
