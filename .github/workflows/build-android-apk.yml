name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html','styles.css','app.js','manifest.webmanifest','capacitor.config.json','package.json','.github/workflows/build-android-apk.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: npm install
      - name: Prepare web assets
        run: |
          mkdir -p www/icons
          cp index.html styles.css app.js manifest.webmanifest sw.js www/
          cp icons/icon.svg www/icons/
      - name: Generate Android project
        run: npx cap add android
      - name: Build Android debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Rename APK for download
        run: cp android/app/build/outputs/apk/debug/app-debug.apk elaines-jewellery-box.apk
      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: Elaine's Jewellery Box Android build ${{ github.run_number }}
          files: elaines-jewellery-box.apk
