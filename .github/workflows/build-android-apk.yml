name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'styles.css'
      - 'app.js'
      - 'manifest.webmanifest'
      - 'capacitor.config.json'
      - 'package.json'
      - 'elaines-jewellery-box-logo.png'
      - 'elaines-jewellery-box-icon.png'
      - '.github/workflows/build-android-apk.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: npm install
      - name: Prepare web assets
        run: |
          mkdir -p www/icons
          cp index.html styles.css app.js manifest.webmanifest sw.js elaines-jewellery-box-logo.png elaines-jewellery-box-icon.png www/
      - name: Generate Android project
        run: npx cap add android
      - name: Sync Capacitor assets
        run: npx cap sync android
      - name: Generate native Android launcher icons from Elaine's artwork
        run: |
          python3 -m pip install --user Pillow
          python3 - <<'PY'
          from PIL import Image, ImageOps
          from pathlib import Path
          import xml.etree.ElementTree as ET

          source = Image.open("elaines-jewellery-box-icon.png").convert("RGBA")
          # Crop to a square without stretching the artwork.
          side = min(source.width, source.height)
          left = (source.width - side) // 2
          top = (source.height - side) // 2
          source = source.crop((left, top, left + side, top + side))

          res = Path("android/app/src/main/res")
          densities = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }
          for folder, size in densities.items():
              target = res / folder
              target.mkdir(parents=True, exist_ok=True)
              icon = source.resize((size, size), Image.Resampling.LANCZOS)
              icon.save(target / "ic_launcher.png", optimize=True)
              icon.save(target / "ic_launcher_round.png", optimize=True)

          # Android adaptive icon: preserve a safe margin so the face/artwork
          # is not clipped by circular, squircle or rounded-square launchers.
          foreground = Image.new("RGBA", (432, 432), (0, 0, 0, 0))
          art = ImageOps.contain(source, (320, 320), method=Image.Resampling.LANCZOS)
          foreground.alpha_composite(art, ((432-art.width)//2, (432-art.height)//2))
          drawable = res / "drawable-nodpi"
          drawable.mkdir(parents=True, exist_ok=True)
          foreground.save(drawable / "ic_launcher_foreground.png", optimize=True)

          values = res / "values"
          values.mkdir(parents=True, exist_ok=True)
          (values / "ic_launcher_background.xml").write_text(
              '<resources><color name="ebj_launcher_background">#090909</color></resources>\n',
              encoding="utf-8"
          )
          adaptive = res / "mipmap-anydpi-v26"
          adaptive.mkdir(parents=True, exist_ok=True)
          xml = '''<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ebj_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          '''
          (adaptive / "ic_launcher.xml").write_text(xml, encoding="utf-8")
          (adaptive / "ic_launcher_round.xml").write_text(xml, encoding="utf-8")
          PY
      - name: Build Android debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Rename APK for download
        run: cp android/app/build/outputs/apk/debug/app-debug.apk elaines-jewellery-box.apk
      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: Elaine's Jewellery Box Android build ${{ github.run_number }}
          files: elaines-jewellery-box.apk
