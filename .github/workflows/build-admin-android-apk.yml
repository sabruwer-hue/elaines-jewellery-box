name: Build EBJ Admin Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'admin.html'
      - 'admin.css'
      - 'admin.js'
      - 'admin-live.js'
      - 'admin.webmanifest'
      - 'update-password.html'
      - 'sw.js'
      - 'icons/admin-icon.svg'
      - 'admin-capacitor.config.json'
      - '.github/workflows/build-admin-android-apk.yml'
permissions:
  contents: write
jobs:
  build-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: npm install
      - name: Prepare private admin web assets
        run: |
          mkdir -p www/icons
          cp admin.html www/index.html
          cp admin.css admin.js admin-live.js admin.webmanifest sw.js update-password.html www/
          cp icons/admin-icon.svg www/icons/
      - name: Select separate admin app configuration
        run: cp admin-capacitor.config.json capacitor.config.json
      - name: Generate separate Android project
        run: npx cap add android
      - name: Sync Capacitor assets
        run: npx cap sync android
      - name: Build Android debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Rename admin APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ebj-admin.apk
      - name: Publish separate admin APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ebj-admin-latest
          name: EBJ Admin Android App
          make_latest: false
          overwrite_files: true
          files: ebj-admin.apk
