# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: \${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare public website files only
        run: |
          mkdir -p site/icons
          cp index.html styles.css app.js manifest.webmanifest privacy.html terms.html admin.html admin.css admin.js admin-live.js admin-finance.js admin.webmanifest update-password.html archive.html archive.css archive.js archive-admin.html archive-admin.js sw.js robots.txt sitemap.xml site/
          cp icons/*.svg site/icons/
          printf '%s\n' 'elainesjewellerybox.co.za' > site/CNAME
          touch site/.nojekyll
      - name: Upload public website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
