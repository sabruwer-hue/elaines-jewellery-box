# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Check JavaScript syntax
        run: |
          for file in app.js admin.js admin-live.js admin-finance.js quotes.js quote-portal.js archive.js archive-admin.js; do
            node --check "$file"
          done
      - name: Prepare public website files only
        run: |
          mkdir -p site/icons
          cp index.html styles.css app.js manifest.webmanifest privacy.html terms.html admin.html admin.css admin.js admin-live.js admin-finance.js quotes.js quote.html quote-portal.js admin.webmanifest update-password.html archive.html archive.css archive.js archive-admin.html archive-admin.js sw.js robots.txt sitemap.xml site/
          cp icons/*.svg site/icons/
          printf '%s\n' 'elainesjewellerybox.co.za' > site/CNAME
          touch site/.nojekyll
      - name: Upload public website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
